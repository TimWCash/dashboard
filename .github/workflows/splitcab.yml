name: SplitCab

on:
  push:
    paths: ['splitcab/**', '.github/workflows/splitcab.yml']
  pull_request:
    paths: ['splitcab/**', '.github/workflows/splitcab.yml']

defaults:
  run:
    working-directory: splitcab

jobs:
  api:
    name: Core and API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: splitcab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: splitcab/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @splitcab/core -w @splitcab/api
      - name: Core tests
        run: npm test -w @splitcab/core
      - name: API tests
        run: npm test -w @splitcab/api
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/splitcab_test
      - name: Build
        run: npm run build -w @splitcab/api

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: splitcab/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @splitcab/mobile -w @splitcab/demo -w @splitcab/site
      - name: Bundle iOS and Android
        working-directory: splitcab/apps/mobile
        run: npx expo export --platform ios --platform android --output-dir dist-check
        env:
          CI: 1
      - name: Build the browser demo
        run: npm run demo:build
        env:
          CI: 1
      - name: Build the shared demo (app and API function)
        run: npm run demo:build:server
        env:
          CI: 1
      - name: Build the website
        run: npm run build -w @splitcab/site

  docker:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/api/Dockerfile -t splitcab-api .
